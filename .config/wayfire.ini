[window-rules]
rule_1 = on created if app_id contains "float-clip" then set geometry_ppt 30 20 40 60
rule_2 = on created if app_id contains "float-full" then set geometry_ppt 10 10 80 80
rule_3 = on created if app_id contains "float-power" then set geometry_ppt 45 42 10 16
rule_4 = on created if app_id contains "float-slim" then set geometry_ppt 37 26 26 47
rule_5 = on created if app_id contains "float-half" then set geometry_ppt 25 25 50 50
rule_6 = on created if app_id contains "float-time" then set geometry_ppt 30 10 40 80
rule_7 = on created if app_id contains "float-polkit" then set geometry_ppt 41 39 18 22
rule_10 = on created if app_id contains "subl" then assign_workspace 0 1
rule_11 = on created if app_id contains "firefox" then assign_workspace 1 0
rule_20 = on created if app_id contains "firefox" then maximize
rule_12 = on created if app_id contains "yazi" then assign_workspace 0 2
rule_13 = on created if app_id contains "btop" then assign_workspace 2 2
rule_14 = on created if app_id contains "btm" then assign_workspace 2 2
rule_15 = on created if app_id contains "mpv" then assign_workspace 1 1
rule_16 = on created if app_id contains "shell" then assign_workspace 0 0
rule_17 = on created if app_id contains "yzf" then assign_workspace 1 2
rule_18 = on created if app_id contains "wcm" then assign_workspace 2 1
rule_19 = on created if app_id contains "nasc" then assign_workspace 1 2

[expo]
background = \#1A1A1AFF
duration = 200ms circle
inactive_brightness = 0.7000
keyboard_interaction = true
offset = 10
toggle = BTN_EXTRA | <super>
transition_length = 200


[simple-tile]
animation_duration = 300ms circle
button_move = <super> BTN_LEFT
button_resize = <super> BTN_RIGHT
inner_gap_size = 0
keep_fullscreen_on_adjacent = false
key_focus_above = <alt> <super> KEY_UP
key_focus_below = <alt> <super> KEY_DOWN
key_focus_left = <alt> <super> KEY_LEFT
key_focus_right = <alt> <super> KEY_RIGHT
key_toggle = none
key_toggle_maximized = none
outer_horiz_gap_size = 0
outer_vert_gap_size = 0
preview_base_border = \#404080CC
preview_base_color = \#8080FF80
preview_border_width = 3
tile_by_default = !(app_id contains "float")


[animate]
close_animation = zoom
duration = 200ms circle
enabled_for = !(app_id is "dulcepan" | app_id is "hyprpicker" | app_id contains "mark-shot" | app_id contains "shmooz" | app_id contains "slurp" | app_id contains "scrop")
fade_enabled_for = none
fire_enabled_for = none
minimize_animation = none
open_animation = zoom
startup_duration = 0ms linear
zoom_enabled_for = none


[pixdecor]
always_decorate = app_id contains "float"
animate = false
bg_color = \#121212FF
border_size = 5
effect_type = none
enable_shade = false
fg_color = \#121212FF
ignore_views = !(app_id contains "float")
maximized_borders = false
maximized_shadows = false
overlay_engine = rounded_corners
rounded_corner_radius = 17
shadow_color = \#000000FF
shadow_radius = 7
titlebar = never


[vswitch]
binding_down = <super> KEY_DOWN
binding_last =
binding_left = <super> KEY_LEFT
binding_right = <super> KEY_RIGHT
binding_up = <super> KEY_UP
duration = 300ms circle
gap = 0
with_win_down = <shift> <super> KEY_DOWN
with_win_last =
with_win_left = <shift> <super> KEY_LEFT
with_win_right = <shift> <super> KEY_RIGHT
with_win_up = <shift> <super> KEY_UP
wraparound = false


[vswipe]
background = \#1A1A1AFF
delta_threshold = 24.000000
duration = 180ms circle
enable_free_movement = true
enable_horizontal = true
enable_smooth_transition = true
enable_vertical = true
fingers = 3
gap = 32.000000
speed_cap = 0.050000
speed_factor = 256.000000
threshold = 0.350000


[follow-focus]
change_output = true
change_view = true
focus_delay = 0
raise_on_top = false
threshold = 0


[preserve-output]
last_output_focus_timeout = 0