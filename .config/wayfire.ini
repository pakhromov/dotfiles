[my-rules]
rule_10 = if app_id contains "subl" then assign-focus 21
rule_11 = if app_id contains "firefox" then assign-focus 12
rule_12 = if app_id contains "yazi" then assign-focus 31
rule_15 = if app_id contains "mpv" then assign-focus 22

[place]
mode = center

[edge-hacks]
enabled_for = app_id contains "brave" | app_id contains "vivaldi" | app_id contains "helium"
edges = bottom:1 right:1
scrollbar_fix = 80:1065
top_left_corner =
top_right_corner =
bottom_left_corner =
bottom_right_corner =

[wobbly]
friction = 3.000000
grid_resolution = 6
spring_k = 8.000000

[expo]
background = \#1A1A1AFF
duration = 200ms circle
inactive_brightness = 0.700
keyboard_interaction = true
offset = 10
toggle = <super>
transition_length = 200

[overview]
background = \#242424FF
duration = 200ms circle
active_border_color = #74AA9CFF
border_size = 3
toggle = BTN_EXTRA
toggle_all = <super>

[simple-tile]
animation_duration = 300ms circle
button_move = <super> BTN_LEFT
button_resize = <super> BTN_RIGHT
inner_gap_size = 0
keep_fullscreen_on_adjacent = false
key_focus_above = <ctrl> <super> KEY_UP
key_focus_below = <ctrl> <super> KEY_DOWN
key_focus_left = <ctrl> <super> KEY_LEFT
key_focus_right = <ctrl> <super> KEY_RIGHT
key_toggle = none
key_toggle_maximized = none
outer_horiz_gap_size = 0
outer_vert_gap_size = 0
preview_base_border = \#404080CC
preview_base_color = \#8080FF80
preview_border_width = 3
tile_by_default = !(app_id contains "float" | app_id contains "mousam")


[animate]
close_animation = zap
duration = 250ms circle
enabled_for = !(app_id is "dulcepan" | app_id is "hyprpicker" | app_id contains "mark-shot" | app_id contains "shmooz" | app_id contains "slurp" | app_id contains "scrop" | app_id contains "grabit")
fade_duration = 400ms circle
fade_enabled_for = none
fire_color = \#B22303FF
fire_duration = 300ms linear
fire_enabled_for = none
fire_particle_size = 16.000000
fire_particles = 2000
minimize_animation = zoom
open_animation = zoom
random_fire_color = false
spin_duration = 250ms linear
spin_rotations = 1
squeezimize_duration = 150ms linear
startup_duration = 0ms linear
zap_duration = 400ms linear
zoom_duration = 500ms circle
zoom_enabled_for = none


[vswitch]
binding_down = <super> KEY_DOWN
binding_last =
binding_left = <super> KEY_LEFT
binding_right = <super> KEY_RIGHT
binding_up = <super> KEY_UP
duration = 300ms circle
gap = 0
with_win_down = <shift> <super> KEY_DOWN
with_win_last =
with_win_left = <shift> <super> KEY_LEFT
with_win_right = <shift> <super> KEY_RIGHT
with_win_up = <shift> <super> KEY_UP
wraparound = false


[follow-focus]
change_output = true
change_view = true
focus_delay = 0
raise_on_top = false
threshold = 0


[preserve-output]
last_output_focus_timeout = 0
