[autostart]
autostart_wf_shell = false
notifications = mako
clipboard = zzzclip daemon
#power = sudo nvidia-smi -lgc 650,1950
sound = audio-default.sh
dbus = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DISPLAY XDG_RUNTIME_DIR  XDG_SESSION_DESKTOP

[output:eDP-1]
mode = 1920x1080@144
position = 0,1080
mode = off

[output:DP-2]
mode = 1920x1080@144
position = 0,0
transform = normal
scale = 1.000000


[input]
3fg_drag = none
click_method = default
cursor_size = 22
cursor_theme = LiOSV
disable_touchpad_while_mouse = false
disable_touchpad_while_typing = false
drag_lock = false
gesture_sensitivity = 1.000000
kb_capslock_default_state = false
kb_numlock_default_state = false
kb_repeat_delay = 300
kb_repeat_rate = 30
left_handed_mode = false
middle_emulation = false
modifier_binding_timeout = 400
mouse_accel_profile = flat
mouse_cursor_speed = 0.000000
mouse_natural_scroll = false
mouse_scroll_speed = 1.000000
natural_scroll = true
scroll_method = default
tablet_motion_mode = default
tap_and_drag = true
tap_to_click = true
touchpad_accel_profile = default
touchpad_cursor_speed = 0.000000
touchpad_scroll_speed = 1.000000
xkb_layout = us, se, ru
xkb_model =
xkb_options = grp:win_space_toggle
xkb_rules = evdev
xkb_variant =


[core]
background_color = \#171717FF
close_top_view = <super> KEY_Q
exit = <alt> <ctrl> KEY_BACKSPACE
focus_button_with_modifiers = false
focus_buttons =
focus_buttons_passthrough = false
max_render_time = -1
plugins = autostart command simple-tile follow-focus animate foreign-toplevel session-lock preserve-output ipc ipc-rules vswitch inject-key my-activation my-rules place overview edge-hacks
preferred_decoration_mode = server
transaction_timeout = 100
vheight = 3
vwidth = 3
xwayland = false
xwayland_startup_script =


[workarounds]
all_dialogs_modal = false
app_id_mode = stock
auto_reload_config = true
config_reload_delay = 20
disable_primary_selection = true
discard_command_output = false
dynamic_repaint_delay = false
enable_input_method_v2 = false
enable_opaque_region_damage_optimizations = true
enable_so_unloading = false
focus_main_surface_instead_of_popup = false
force_frame_sync = false
force_preferred_decoration_mode = false
keep_last_toplevel_activated = false
max_buffer_size = 3840
remove_output_limits = false
use_external_output_configuration = false


