"$schema" = 'https://starship.rs/config-schema.json'
#([ ](fg:color_fg bg:color_bg)$sudo)\
format = """
[╭─](#585858)[](color_bg)\
$os\
[ ](fg:color_fg bg:color_bg)$directory\
([ ](fg:color_fg bg:color_bg)$git_branch)$git_metrics$git_status\
([ ](fg:color_fg bg:color_bg)$jobs)\
[](fg:color_bg)\
$fill\
[](fg:color_bg)[ ](bg:color_bg)\
(${custom.claude}[╱ ](fg:color_fg bg:color_bg))\
(${custom.codex}[╱ ](fg:color_fg bg:color_bg))\
(${custom.per_dir_history}[╱ ](fg:color_fg bg:color_bg))\
(${custom.docker}[╱ ](fg:color_fg bg:color_bg))\
($container[╱ ](fg:color_fg bg:color_bg))\
($direnv[╱ ](fg:color_fg bg:color_bg))\
($nix_shell[╱ ](fg:color_fg bg:color_bg))\
($kubernetes[╱ ](fg:color_fg bg:color_bg))\
($package[╱ ](fg:color_fg bg:color_bg))\
($python[╱ ](fg:color_fg bg:color_bg))\
($conda[╱ ](fg:color_fg bg:color_bg))\
($rust[╱ ](fg:color_fg bg:color_bg))\
($golang[╱ ](fg:color_fg bg:color_bg))\
($c[╱ ](fg:color_fg bg:color_bg))\
($cpp[╱ ](fg:color_fg bg:color_bg))\
($cmake[╱ ](fg:color_fg bg:color_bg))\
($meson[╱ ](fg:color_fg bg:color_bg))\
($zig[╱ ](fg:color_fg bg:color_bg))\
($java[╱ ](fg:color_fg bg:color_bg))\
($lua[╱ ](fg:color_fg bg:color_bg))\
($nodejs[╱ ](fg:color_fg bg:color_bg))\
($ruby[╱ ](fg:color_fg bg:color_bg))\
($haskell[╱ ](fg:color_fg bg:color_bg))\
($scala[╱ ](fg:color_fg bg:color_bg))\
($rlang[╱ ](fg:color_fg bg:color_bg))\
($php[╱ ](fg:color_fg bg:color_bg))\
($perl[╱ ](fg:color_fg bg:color_bg))\
($nim[╱ ](fg:color_fg bg:color_bg))\
($kotlin[╱ ](fg:color_fg bg:color_bg))\
($gradle[╱ ](fg:color_fg bg:color_bg))\
($dotnet[╱ ](fg:color_fg bg:color_bg))\
($username$hostname[╱ ](fg:color_fg bg:color_bg))\
$status[╱ ](fg:color_fg bg:color_bg)\
[ ](fg:248 bg:color_bg)$cmd_duration\
[](fg:color_bg) $line_break\
$character\
"""

add_newline = false
palette = 'dark'

[palettes.dark]
#color_bg = '#272727'
color_bg = '#242424'
color_fg = '#000000'

[cmd_duration]
min_time = 0
show_milliseconds = true
format = '[$duration]($style)'
style = 'fg:248 bg:color_bg'

[status]
disabled = false
format = '[$symbol( $common_meaning)( $signal_name)( $signal_number)( $maybe_int) ]($style)'
style = 'bold fg:160 bg:color_bg'
success_style = 'bold fg:70 bg:color_bg'
symbol = '✘'
success_symbol = ''
map_symbol = false
pipestatus = true
pipestatus_format = '[$pipestatus]($style)'

[character]
success_symbol = '[╰─](bold fg:#585858)[](bold fg:#E0F8FF)'
error_symbol = '[╰─](bold fg:#585858)[](bold fg:196)'

[fill]
symbol = '─'
style = 'fg:240'

[os]
format = '[$symbol]($style)'
style = 'fg:#E0F8FF bg:color_bg'
disabled = false

[sudo]
format = '[$symbol ]($style)'
style = 'bold fg:blue bg:color_bg'
symbol = "󰪋 sudo"
disabled = false

[directory]
format ='[$read_only]($read_only_style)[ ](fg:#43CCEA bg:color_bg)[$path ]($style)'
style = 'fg:#43CCEA bg:color_bg'
read_only_style = 'bold fg:31 bg:color_bg'
repo_root_format = '[$read_only]($read_only_style)[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path ]($style)'
before_repo_root_style = 'bold fg:31 bg:color_bg'
repo_root_style = 'bold fg:39 bg:color_bg'
read_only = "󰌾 "
home_symbol = '~'
truncate_to_repo = false
truncation_length = 5

[jobs]
symbol = ' '
number_threshold = 2
symbol_threshold = 1
format = '[$symbol$number ]($style)'
style = 'bold fg:76 bg:color_bg'

[git_branch]
format = '[$symbol$branch(:$remote_branch) ]($style)'
symbol = " "
style = 'bold fg:76 bg:color_bg'

[git_status]
format = '([ $all_status$ahead_behind]($style))'
style = 'bold fg:246 bg:color_bg'
conflicted = '~${count} '
stashed = '*${count} '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇠${behind_count} ⇢${ahead_count} '
untracked = '?${count} '
modified = '!${count} '
staged = '+${count} '
renamed = '»${count} '
deleted = '✘${count} '

[git_metrics]
deleted_style = 'bold fg:bold red bg:color_bg'
added_style = 'bold fg:bold green bg:color_bg'
format = '([ +$added ]($added_style))([-$deleted ]($deleted_style))'
disabled = false

[container]
format = '[$symbol \[$name\] ]($style)'
style = 'bold dimmed fg:red bg:color_bg'
symbol = " "

[docker_context]
format = '[$symbol$context ]($style)'
style = 'bold fg:blue bg:color_bg'
symbol = " "

[kubernetes]
format = '[($user on )($cluster in )$context \($namespace\) ]($style)'
style = 'bold fg:blue bg:color_bg'
detect_files = ['k8s']
symbol = " "
disabled = false

[username]
format = '[$user]($style)'
style_root = 'bold fg:178 bg:color_bg'
style_user = 'fg:180 bg:color_bg'

[hostname]
format = '[$ssh_symbol$hostname]($style)'
style = 'fg:180 bg:color_bg'
ssh_symbol = '@'

[direnv]
disabled = false
format = '[$symbol$loaded/$allowed ]($style)'
style = 'bold fg:178 bg:color_bg'
symbol = " "

[meson]
format = '[$symbol$project ]($style)'
style = 'fg:180 bg:color_bg'
symbol = "󱥊 "

[nix_shell]
format = '[$symbol$state ]($style)'
style = 'bold fg:blue bg:color_bg'
symbol = " "

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
Arch = " "
