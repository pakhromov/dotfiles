# Give flow (the text editor) the whole keyboard.
#
# The `flow` wrapper in ~/.local/bin sets the kitty user variable FLOW=1 on its
# window (via the OSC 1337 SetUserVar escape) while it runs, and clears it on
# exit. Every GLOBAL shortcut is re-mapped here to no_op when FLOW=1.
#
# no_op is the right action, NOT discard_event: kitty parses no_op into an empty
# action definition, and dispatching an empty definition returns consumed=False,
# so the key is passed through to the program. discard_event would swallow it.
# Conditional maps (--when-focus-on var:PAGER_MODE / var:SEARCH_MODE) are not
# listed: those vars are never set on a flow window, so they cannot fire there.
#
# Only global maps need listing, and `clear_all_shortcuts yes` means this list is
# complete as of generation (33 keys). If you add a NEW global map, add a
# matching no_op line here too, or flow will lose that key.

map --when-focus-on var:FLOW=1 ctrl+shift+0         no_op
map --when-focus-on var:FLOW=1 ctrl+shift+[         no_op
map --when-focus-on var:FLOW=1 ctrl+shift+]         no_op
map --when-focus-on var:FLOW=1 ctrl+shift+a         no_op
map --when-focus-on var:FLOW=1 ctrl+shift+alt+down  no_op
map --when-focus-on var:FLOW=1 ctrl+shift+alt+enter no_op
map --when-focus-on var:FLOW=1 ctrl+shift+alt+up    no_op
map --when-focus-on var:FLOW=1 ctrl+shift+backspace no_op
map --when-focus-on var:FLOW=1 ctrl+shift+c         no_op
map --when-focus-on var:FLOW=1 ctrl+shift+down      no_op
map --when-focus-on var:FLOW=1 ctrl+shift+enter     no_op
map --when-focus-on var:FLOW=1 ctrl+shift+equal     no_op
map --when-focus-on var:FLOW=1 ctrl+shift+f         no_op
map --when-focus-on var:FLOW=1 ctrl+shift+f1        no_op
map --when-focus-on var:FLOW=1 ctrl+shift+f10       no_op
map --when-focus-on var:FLOW=1 ctrl+shift+f2        no_op
map --when-focus-on var:FLOW=1 ctrl+shift+f3        no_op
map --when-focus-on var:FLOW=1 ctrl+shift+f4        no_op
map --when-focus-on var:FLOW=1 ctrl+shift+f5        no_op
map --when-focus-on var:FLOW=1 ctrl+shift+f6        no_op
map --when-focus-on var:FLOW=1 ctrl+shift+f9        no_op
map --when-focus-on var:FLOW=1 ctrl+shift+left      no_op
map --when-focus-on var:FLOW=1 ctrl+shift+m         no_op
map --when-focus-on var:FLOW=1 ctrl+shift+minus     no_op
map --when-focus-on var:FLOW=1 ctrl+shift+o         no_op
map --when-focus-on var:FLOW=1 ctrl+shift+right     no_op
map --when-focus-on var:FLOW=1 ctrl+shift+s         no_op
map --when-focus-on var:FLOW=1 ctrl+shift+u         no_op
map --when-focus-on var:FLOW=1 ctrl+shift+up        no_op
map --when-focus-on var:FLOW=1 ctrl+shift+v         no_op
map --when-focus-on var:FLOW=1 ctrl+shift+w         no_op
map --when-focus-on var:FLOW=1 ctrl+shift+z         no_op
map --when-focus-on var:FLOW=1 escape               no_op

# Mouse: give flow the buttons too.
#
# IMPORTANT -- this part is NOT scoped to flow. kitty's mouse_map has no
# --when-focus-on: parse_mouse_map takes exactly "button event modes action"
# and nothing else, so the conditional trick used for keys above is not
# available for mouse buttons.
#
# What IS available is the mode column. `grabbed` means the program running in
# the window has asked for mouse reporting, which flow does (it calls
# setMouseMode on startup). So every mouse_map listed for `ungrabbed` only is
# already inert in flow, and mapping the `grabbed` variant to no_op removes it
# -- verified: the grabbed entries disappear from opts.mousemap entirely, while
# the ungrabbed ones are untouched.
#
# The cost is that this applies to every mouse-grabbing program, not just flow:
# htop, yazi, lazygit and friends lose these four as well. Two are worth a
# second thought before keeping:
#   shift+left -- kitty's usual escape hatch for selecting text inside a TUI.
#                 flow has its own shift+click selection, other TUIs do not.
#   b4         -- your back-button-as-right-click kitten, gone in those TUIs too.
# Comment either line out to keep it everywhere but flow-with-that-button.

#mouse_map left click       grabbed no_op
#mouse_map shift+left press grabbed no_op
#mouse_map right press      grabbed no_op
#mouse_map b4 press         grabbed no_op
