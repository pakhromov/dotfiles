map ctrl+shift+f launch --location=hsplit --bias=2 --var SEARCH_WIN=1 --allow-remote-control kitty +kitten search.py @active-kitty-window-id
# On the search window itself, ctrl+shift+f would otherwise re-fire the global launch above and open a second search. Swallow it here so it does nothing.
# (no_op won't work -- kitty treats it as "unbind", leaving the global active.)
map --when-focus-on var:SEARCH_WIN=1 ctrl+shift+f    discard_event

# Pager quit keys (kitty-pager.sh reads these; raw characters, not kitty key specs, since the pager reads bytes directly).
env PAGER_QUIT=q
env PAGER_QUIT_ESC=1
# When the PAGER overlay (kitty-pager.sh, tagged --var PAGER_MODE=1) is focused, make plain up/down scroll one line at a time like a normal pager.
map --when-focus-on var:PAGER_MODE=1 up              scroll_line_up
map --when-focus-on var:PAGER_MODE=1 down            scroll_line_down
map --when-focus-on var:PAGER_MODE=1 page_up         scroll_page_up
map --when-focus-on var:PAGER_MODE=1 space           scroll_page_up
map --when-focus-on var:PAGER_MODE=1 page_down       scroll_page_down
map --when-focus-on var:PAGER_MODE=1 enter           scroll_page_down
map --when-focus-on var:PAGER_MODE=1 home            scroll_home
map --when-focus-on var:PAGER_MODE=1 left            scroll_home
map --when-focus-on var:PAGER_MODE=1 end             scroll_end
map --when-focus-on var:PAGER_MODE=1 right           scroll_end
# Inside the pager, / and ctrl+f also open search (the global ctrl+shift+f already works everywhere).
# The search window is tagged --var SEARCH_WIN=1 so the SEARCH_MODE maps below can forward keys to it; focus moves to it on launch so you can type immediately.
map --when-focus-on var:PAGER_MODE=1 ctrl+shift+f    launch --location=hsplit --bias=2 --var SEARCH_WIN=1 --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map --when-focus-on var:PAGER_MODE=1 ctrl+f          launch --location=hsplit --bias=2 --var SEARCH_WIN=1 --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map --when-focus-on var:PAGER_MODE=1 /               launch --location=hsplit --bias=2 --var SEARCH_WIN=1 --allow-remote-control kitty +kitten search.py @active-kitty-window-id



# Search active (SEARCH_MODE=1, set by search.py while it runs -- on ANY window, pager or not).
# Nav keys are forwarded to the unfocused search window (var:SEARCH_WIN=1).
# On a pager these maps take precedence over the PAGER_MODE=1 scroll maps while search is open.
map --when-focus-on var:SEARCH_MODE=1 up             scroll_line_up
map --when-focus-on var:SEARCH_MODE=1 down           scroll_line_down
map --when-focus-on var:SEARCH_MODE=1 page_up        scroll_page_up
map --when-focus-on var:SEARCH_MODE=1 page_down      scroll_page_down
map --when-focus-on var:SEARCH_MODE=1 home           scroll_home
map --when-focus-on var:SEARCH_MODE=1 end            scroll_end
map --when-focus-on var:SEARCH_MODE=1 tab            remote_control send-key --match var:SEARCH_WIN=1 tab
map --when-focus-on var:SEARCH_MODE=1 enter          remote_control send-key --match var:SEARCH_WIN=1 enter
map --when-focus-on var:SEARCH_MODE=1 shift+enter    remote_control send-key --match var:SEARCH_WIN=1 shift+enter
# ctrl+shift+f/ctrl+f// focus the existing search window instead of opening a second one.
map --when-focus-on var:SEARCH_MODE=1 ctrl+shift+f   remote_control focus-window --match var:SEARCH_WIN=1
map --when-focus-on var:SEARCH_MODE=1 ctrl+f         remote_control focus-window --match var:SEARCH_WIN=1
map --when-focus-on var:SEARCH_MODE=1 /              remote_control focus-window --match var:SEARCH_WIN=1
# esc: forward to the search window to close it cleanly, AND clear SEARCH_MODE locally as a safety net, so a search window that was closed abnormally can't
# leave the window stuck forwarding keys into the void. PAGER_MODE is never touched, so a normal window returns to normal keys and a pager falls back to
# its scroll maps automatically.
map --when-focus-on var:SEARCH_MODE=1 esc            combine | remote_control send-key --match var:SEARCH_WIN=1 esc | remote_control set-user-vars SEARCH_MODE

# Keybinds handled inside the search kitten (search.py reads these from the environment; each is a kitty key spec).
# Changing them needs a kitty restart, not just a config reload, since env vars are baked in at child-spawn time.
env SEARCH_MODE_SWITCH=tab
env SEARCH_PREV=shift+enter
env SEARCH_NEXT=enter
env SEARCH_CLEAR=ctrl+shift+backspace
env SEARCH_WORD_LEFT=ctrl+left
env SEARCH_WORD_RIGHT=ctrl+right
env SEARCH_CANCEL=esc
env SEARCH_SCROLL_UP=up
env SEARCH_SCROLL_DOWN=down
env SEARCH_PAGE_UP=page_up
env SEARCH_PAGE_DOWN=page_down
#env SEARCH_FIRST=
#env SEARCH_LAST=

#export MANROFFOPT='-rHY=0' (man pages should not divide words)
#enabled_layouts splits (needs set to make it work)