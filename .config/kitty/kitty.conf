include current-theme.conf
remember_window_size no
hide_window_decorations yes
wayland_enable_ime no
#startup_session ~/.config/kitty/startup.session
#shell .
#editor .
enabled_layouts splits
strip_trailing_spaces always
focus_follows_mouse yes
progress_bar top
auto_reload_config -1
click_interval 0.2
repaint_delay 3
sync_to_monitor no
confirm_os_window_close 0
update_check_interval 0


allow_remote_control yes
listen_on unix:@mykitty
allow_cloning yes

#select_by_word_characters @-./_~?&=%+#
shell_integration no-cursor
cursor_shape block
cursor_stop_blinking_after 0
cursor_blink_interval 0

enable_audio_bell no
window_alert_on_bell no
notify_on_cmd_finish unfocused 5
notification_close_on_focus yes


copy_on_select clipboard
paste_actions quote-urls-at-prompt
clear_selection_on_clipboard_loss yes
clipboard_control write-clipboard read-clipboard


cursor_trail 1
pixel_scroll yes
mouse_hide_wait 2
momentum_scroll 1.0
scrollback_lines 50000
scrollback_pager kitty-pager.sh
scrollback_fill_enlarged_window yes
scrollbar always
scrollbar_interactive yes
scrollbar_jump_on_click yes
scrollbar_gap 0
scrollbar_width 0.5
scrollbar_hover_width 0.5
scrollbar_handle_opacity 0.1
scrollbar_handle_color #FFFFFF
scrollbar_track_opacity 0.0
scrollbar_track_hover_opacity 0.0


tab_bar_edge top
tab_bar_style custom
tab_bar_align center
tab_bar_min_tabs 2
#tab_bar_margin_height 0 3
placement_strategy top-right
window_border_width 1.0pt
active_border_color #404040
inactive_border_color #404040
#inactive_text_alpha 0.5


clear_all_shortcuts yes
clear_all_mouse_actions yes
map ctrl+shift+f1 kitten themes --cache-age 9999
map ctrl+shift+f2 edit_config_file
map ctrl+shift+f3 command_palette
map ctrl+shift+f4 open_url https://sw.kovidgoyal.net/kitty/
map ctrl+shift+f5 load_config_file
map ctrl+shift+f6 debug_config
map ctrl+shift+f9 kitten switch_font.py
map ctrl+shift+f10 kitten switch_font.py prev

mouse_map left click grabbed,ungrabbed mouse_handle_click selection link prompt
mouse_map left press ungrabbed mouse_selection normal
mouse_map shift+left press grabbed mouse_selection normal
mouse_map right press ungrabbed,grabbed mouse_selection rectangle
mouse_map left doublepress ungrabbed mouse_selection word
mouse_map middle release ungrabbed paste_from_clipboard
mouse_map b4 press ungrabbed mouse_select_command_output
mouse_map b4 press grabbed kitten back_button_as_right_click.py

map ctrl+shift+right kitten smart_tab_right.py
map ctrl+shift+left kitten smart_tab_left.py
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+alt+enter launch --location=hsplit --cwd=current
map ctrl+shift+up previous_window
map ctrl+shift+down next_window
map ctrl+shift+w close_window
map ctrl+shift+a kitten select_all_scrollback.py
map escape kitten escape_or_close_dashboard.py
map ctrl+shift+s swap_with_window
map ctrl+shift+m detach_window ask
map ctrl+shift+f launch --location=hsplit --bias=2 --var SEARCH_WIN=1 --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_last_command_output
map ctrl+shift+o kitten hints --type hyperlink
map ctrl+shift+u open_url_with_hints


map ctrl+shift+[ scroll_to_prompt -1
map ctrl+shift+] scroll_to_prompt 1


# When the MANPAGER overlay (kitty-pager.sh, tagged --var PAGER_MODE=1) is
# focused, make plain up/down scroll one line at a time like a normal pager.
map --when-focus-on var:PAGER_MODE=1 up         scroll_line_up
map --when-focus-on var:PAGER_MODE=1 down       scroll_line_down
map --when-focus-on var:PAGER_MODE=1 page_up    scroll_page_up
map --when-focus-on var:PAGER_MODE=1 space      scroll_page_up
map --when-focus-on var:PAGER_MODE=1 page_down  scroll_page_down
map --when-focus-on var:PAGER_MODE=1 enter      scroll_page_down
map --when-focus-on var:PAGER_MODE=1 home       scroll_home
map --when-focus-on var:PAGER_MODE=1 left       scroll_home
map --when-focus-on var:PAGER_MODE=1 end        scroll_end
map --when-focus-on var:PAGER_MODE=1 right      scroll_end
# Inside the pager, / and ctrl+f also open search (the global ctrl+shift+f on
# line 104 already works everywhere). The search window is tagged --var SEARCH_WIN=1
# so the SEARCH_MODE maps below can forward keys to it; focus moves to it on
# launch so you can type immediately.
map --when-focus-on var:PAGER_MODE=1 ctrl+shift+f launch --location=hsplit --bias=2 --var SEARCH_WIN=1 --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map --when-focus-on var:PAGER_MODE=1 ctrl+f launch --location=hsplit --bias=2 --var SEARCH_WIN=1 --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map --when-focus-on var:PAGER_MODE=1 / launch --location=hsplit --bias=2 --var SEARCH_WIN=1 --allow-remote-control kitty +kitten search.py @active-kitty-window-id
# Search active (SEARCH_MODE=1, set by search.py while it runs -- on ANY window,
# pager or not). Nav keys are forwarded to the unfocused search window
# (var:SEARCH_WIN=1) so its key handling drives result navigation while you keep
# reading; page/home/end still scroll the window directly. On a pager these
# maps take precedence over the PAGER_MODE=1 scroll maps while search is open.
# ctrl+shift+f/ctrl+f// focus the existing search window instead of opening a
# second one.
map --when-focus-on var:SEARCH_MODE=1 ctrl+shift+f   remote_control focus-window --match var:SEARCH_WIN=1
map --when-focus-on var:SEARCH_MODE=1 ctrl+f         remote_control focus-window --match var:SEARCH_WIN=1
map --when-focus-on var:SEARCH_MODE=1 /              remote_control focus-window --match var:SEARCH_WIN=1
map --when-focus-on var:SEARCH_MODE=1 up             remote_control send-key --match var:SEARCH_WIN=1 up
map --when-focus-on var:SEARCH_MODE=1 down           remote_control send-key --match var:SEARCH_WIN=1 down
map --when-focus-on var:SEARCH_MODE=1 ctrl+up        remote_control send-key --match var:SEARCH_WIN=1 ctrl+up
map --when-focus-on var:SEARCH_MODE=1 ctrl+down      remote_control send-key --match var:SEARCH_WIN=1 ctrl+down
map --when-focus-on var:SEARCH_MODE=1 tab            remote_control send-key --match var:SEARCH_WIN=1 tab
map --when-focus-on var:SEARCH_MODE=1 enter          remote_control send-key --match var:SEARCH_WIN=1 enter
# esc: forward to the search window to close it cleanly, AND clear SEARCH_MODE
# locally as a safety net, so a search window that was closed abnormally can't
# leave the window stuck forwarding keys into the void. PAGER_MODE is never
# touched, so a normal window returns to normal keys and a pager falls back to
# its scroll maps automatically.
map --when-focus-on var:SEARCH_MODE=1 esc        combine | remote_control send-key --match var:SEARCH_WIN=1 esc | remote_control set-user-vars SEARCH_MODE
map --when-focus-on var:SEARCH_MODE=1 page_up    scroll_page_up
map --when-focus-on var:SEARCH_MODE=1 page_down  scroll_page_down
map --when-focus-on var:SEARCH_MODE=1 home       scroll_home
map --when-focus-on var:SEARCH_MODE=1 end        scroll_end

# Keybinds handled inside the search kitten (search.py reads these from the
# environment; each is a kitty key spec). Changing them needs a kitty restart,
# not just a config reload, since env vars are baked in at child-spawn time.
env SEARCH_MODE_SWITCH=tab
env SEARCH_PREV=up
env SEARCH_NEXT=down
env SEARCH_FIRST=ctrl+up
env SEARCH_LAST=ctrl+down
env SEARCH_CLEAR=ctrl+shift+backspace
env SEARCH_WORD_LEFT=ctrl+left
env SEARCH_WORD_RIGHT=ctrl+right
env SEARCH_ACCEPT=enter
env SEARCH_CANCEL=esc

map ctrl+shift+minus change_font_size all -0.1
map ctrl+shift+equal change_font_size all +0.1
map ctrl+shift+0 change_font_size all 0


map ctrl+shift+z send_text all \x1b[122;6u
map ctrl+shift+backspace send_text all \x1b[127;6u




bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.2
font_family      family="ComicShannsLigaMod Nerd Font"
