include current-theme.conf
remember_window_size no
hide_window_decorations yes
wayland_enable_ime no
#startup_session ~/.config/kitty/startup.session
#shell .
#editor .
enabled_layouts splits
strip_trailing_spaces always
focus_follows_mouse yes
progress_bar top
auto_reload_config -1
click_interval 0.2
repaint_delay 3
sync_to_monitor no
confirm_os_window_close 0
update_check_interval 0


allow_remote_control yes
listen_on unix:@mykitty
allow_cloning yes

#select_by_word_characters @-./_~?&=%+#
#shell_integration no-cursor
#cursor_shape block
#cursor_stop_blinking_after 0
#cursor_blink_interval 1

enable_audio_bell no
window_alert_on_bell no
notify_on_cmd_finish unfocused 5
notification_close_on_focus yes


copy_on_select clipboard
paste_actions quote-urls-at-prompt
clear_selection_on_clipboard_loss yes
clipboard_control write-clipboard read-clipboard


cursor_trail 1
pixel_scroll yes
mouse_hide_wait 0
momentum_scroll 1.0
scrollback_lines 50000
scrollback_pager lore
scrollback_fill_enlarged_window yes
scrollbar always
scrollbar_interactive yes
scrollbar_jump_on_click yes
scrollbar_gap 0
scrollbar_width 0.5
scrollbar_hover_width 0.5
scrollbar_handle_opacity 0.1
scrollbar_handle_color #FFFFFF
scrollbar_track_opacity 0.0
scrollbar_track_hover_opacity 0.0


tab_bar_edge top
tab_bar_style custom
tab_bar_align center
tab_bar_min_tabs 2
placement_strategy top-right
window_border_width 1.0pt
active_border_color #404040
inactive_border_color #404040
#inactive_text_alpha 0.5


clear_all_shortcuts yes
clear_all_mouse_actions yes
map ctrl+shift+f1 kitten themes --cache-age 9999
map ctrl+shift+f2 edit_config_file
map ctrl+shift+f3 command_palette
map ctrl+shift+f4 open_url https://sw.kovidgoyal.net/kitty/
map ctrl+shift+f5 load_config_file
map ctrl+shift+f6 debug_config
map ctrl+shift+f9 kitten switch_font.py
map ctrl+shift+f10 kitten switch_font.py prev

mouse_map left click grabbed,ungrabbed mouse_handle_click selection link prompt
mouse_map left press ungrabbed mouse_selection normal
mouse_map shift+left press grabbed mouse_selection normal
mouse_map right press ungrabbed,grabbed mouse_selection rectangle
mouse_map left doublepress ungrabbed mouse_selection word
mouse_map middle release ungrabbed paste_from_clipboard
mouse_map b4 press ungrabbed mouse_select_command_output
mouse_map b4 press grabbed kitten back_button_as_right_click.py

map ctrl+shift+right kitten smart_tab_right.py
map ctrl+shift+left kitten smart_tab_left.py
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+alt+enter launch --location=hsplit --cwd=current
map ctrl+shift+up previous_window
map ctrl+shift+down next_window
map ctrl+shift+w close_window
map ctrl+shift+a kitten select_all_scrollback.py
map escape kitten escape_or_close_dashboard.py
map ctrl+shift+s swap_with_window
map ctrl+shift+m detach_window ask
#map ctrl+shift+f search_scrollback
map ctrl+shift+f launch --location=hsplit --bias=2 --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_last_command_output
map ctrl+shift+o kitten hints --type hyperlink
map ctrl+shift+u open_url_with_hints


map ctrl+shift+[ scroll_to_prompt -1
map ctrl+shift+] scroll_to_prompt 1

map ctrl+shift+minus change_font_size all -0.1
map ctrl+shift+equal change_font_size all +0.1
map ctrl+shift+0 change_font_size all 0


map ctrl+shift+z send_text all \x1b[122;6u
map ctrl+shift+backspace send_text all \x1b[127;6u




bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.2
font_family      family="ComicShannsLigaMod Nerd Font"
