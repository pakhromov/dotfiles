# xdg-desktop-portal-hyprland
#
# Vivaldi creates a ScreenCast session, closes it, and immediately opens a
# second one (confirmed in the portal log: created/started/closed then a new
# session 38ms later). Each fresh session prompts, which is why the picker
# appeared twice. allow_token_by_default lets the second request restore the
# first selection via a restore token instead of asking again.
#
# cursor_mode follows the xdg ScreenCast spec:
#   1 = hidden, 2 = embedded (drawn into the video), 4 = metadata (sent
#   out-of-band, which browsers generally do not composite). 2 is what makes
#   the pointer visible in a browser capture.
screencopy {
    allow_token_by_default = true
    cursor_mode = 2
}
