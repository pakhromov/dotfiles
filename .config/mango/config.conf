# Mango WM Configuration
# Ported from Wayfire (wayfire.ini → config.conf)
# See https://mangowm.github.io/docs/configuration

# ─── Autostart ────────────────────────────────────────────────
# Wayfire [autostart] / [command] binding_29 = <super> KEY_ENTER
exec-once=autostart -w
exec-once=wlr-randr --output eDP-1 --off --output DP-2 --mode 1920x1080@144.001007 --pos 0,0
xwayland_persistence=0
# ─── Window Effects ───────────────────────────────────────────
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=0
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x000000ff

border_radius=12
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# ─── Animation ────────────────────────────────────────────────
# Wayfire used zoom ("zap") open/close at ~300-400 ms
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=300
animation_duration_open=400
animation_duration_tag=300
animation_duration_close=400
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.46,1.0,0.29,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# ─── Scroller Layout ──────────────────────────────────────────
scroller_structs=0
scroller_default_proportion=1.0
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# ─── Master-Stack Layout ──────────────────────────────────────
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# ─── Dwindle Layout ───────────────────────────────────────────
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# ─── Overview ─────────────────────────────────────────────────
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# ─── Misc ─────────────────────────────────────────────────────
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# ─── Keyboard ─────────────────────────────────────────────────
repeat_rate=40
repeat_delay=400
numlockon=0
xkb_rules_rules=evdev
xkb_rules_model=pc105
xkb_rules_layout=us,se,ru
xkb_rules_variant=,,
xkb_rules_options=grp:win_space_toggle
# Note: grp:win_space_toggle makes Super+Space switch layout at the XKB level.
# The keyboard-layout-switcher.sh binding below can coexist if that script
# does additional work (e.g. notifying a status bar).

# ─── Trackpad ─────────────────────────────────────────────────
# Requires relogin to apply.
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_natural_scrolling=1
disable_while_typing=0
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# ─── Mouse ────────────────────────────────────────────────────
# Requires relogin to apply.
mouse_natural_scrolling=0
mouse_accel_profile=1
mouse_accel_speed=0.0

# ─── Appearance ───────────────────────────────────────────────
gappih=4
gappiv=4
gappoh=0
gappov=0
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=0
rootcolor=0x1a1a1aff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# ─── Tag Layouts ──────────────────────────────────────────────
# Wayfire used simple-tile on all workspaces.
# The 3×3 virtual desktop grid (vwidth=3 vheight=3) maps to tags 1–9.
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# ─── Window Rules ─────────────────────────────────────────────
# Wayfire [window-rules]:
#   rule_1: app_id contains "float-half" → geometry_ppt 25 0 50 100
#           (centred, 50 % wide, full-height floating window)
windowrule=isfloating:1,width:5000,height:9999,appid:float-half

#   rule_2: app_id contains "float-full" → geometry_ppt 0 0 100 100
#           (full-screen floating window)
windowrule=isfloating:1,width:9999,height:9999,appid:float-full
windowrule=isfloating:1,isglobal:1,isfakefullscreen:1,animation_type_open:none,animation_type_close:none,appid:flameshot

# Wayfire [simple-tile] tile_by_default = !(app_id contains "float")
# → all float-* windows are floating; the two rules above already cover them.

# ─── Key Bindings ─────────────────────────────────────────────
# Rule: SUPER must be held for all compositor actions.
# Exception: media/hardware keys (XF86*) are modifier-free by convention.
# Modifier names: SUPER CTRL ALT SHIFT NONE
# bind[flags]=MODIFIERS,KEY,DISPATCHER,PARAMS

# ── Config reload ─────────────────────────────────────────────
bind=SUPER,r,reload_config

# ── System ────────────────────────────────────────────────────
bind=SUPER,Q,killclient
bind=SUPER+CTRL+ALT,BackSpace,quit
bind=SUPER,L,spawn,hyprlock

# ── Window state ──────────────────────────────────────────────
bind=SUPER,T,togglefloating
bind=SUPER+ALT,f,togglefullscreen
bind=SUPER+ALT+SHIFT,f,togglefakefullscreen
bind=SUPER+ALT,a,togglemaximizescreen
bind=SUPER,g,toggleglobal
bind=SUPER,o,toggleoverlay
bind=SUPER+ALT,z,toggle_scratchpad
bind=SUPER+SHIFT,l,switch_layout

# ── Focus direction (wayfire: <alt><super> KEY_direction) ─────
bind=SUPER+ALT,Left,focusdir,left
bind=SUPER+ALT,Right,focusdir,right
bind=SUPER+ALT,Up,focusdir,up
bind=SUPER+ALT,Down,focusdir,down

# ── Tag (workspace) navigation ────────────────────────────────
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=SUPER+SHIFT,Left,tagtoleft,0
bind=SUPER+SHIFT,Right,tagtoright,0

# Direct tag switch (was Ctrl+N — moved under SUPER)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move window to tag (was Alt+N — moved under SUPER+SHIFT)
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# ── Monitor navigation ────────────────────────────────────────
bind=SUPER+ALT+SHIFT,Left,focusmon,left
bind=SUPER+ALT+SHIFT,Right,focusmon,right
bind=SUPER+CTRL,Left,tagmon,left
bind=SUPER+CTRL,Right,tagmon,right

# ── Gaps ──────────────────────────────────────────────────────
bind=SUPER+ALT+SHIFT,X,incgaps,1
bind=SUPER+ALT+SHIFT,Z,incgaps,-1
bind=SUPER+ALT+SHIFT,R,togglegaps

# ── Float window move (keyboard) ─────────────────────────────
# Use SUPER+drag for resize (mousebind below); keyboard move needs SUPER.
bind=SUPER+CTRL+SHIFT,Up,movewin,+0,-50
bind=SUPER+CTRL+SHIFT,Down,movewin,+0,+50
bind=SUPER+CTRL+SHIFT,Left,movewin,-50,+0
bind=SUPER+CTRL+SHIFT,Right,movewin,+50,+0

# ── Layout (scroller / dwindle) ──────────────────────────────
bind=SUPER+ALT,equal,set_proportion,1.0
bind=SUPER+ALT,minus,switch_proportion_preset
bind=SUPER+ALT+CTRL,Left,scroller_stack,left
bind=SUPER+ALT+CTRL,Right,scroller_stack,right
bind=SUPER+ALT+CTRL,Up,scroller_stack,up
bind=SUPER+ALT+CTRL,Down,scroller_stack,down

# ── Overview ─────────────────────────────────────────────────
bind=SUPER+ALT,Tab,toggleoverview

# ── Terminals ─────────────────────────────────────────────────
bind=SUPER,Return,spawn,autostart -w
bind=SUPER+SHIFT,Return,spawn_shell,kitty --single-instance --listen-on="unix:@mykitty"
bind=SUPER+SHIFT+ALT,Return,spawn,monstar

# ── Application launchers ─────────────────────────────────────
bind=SUPER,Z,spawn,firefox
bind=SUPER+SHIFT,Z,spawn,firefox --private-window
bind=SUPER,A,spawn_shell,kitty --single-instance --listen-on="unix:@mykitty" yazi
bind=SUPER,U,spawn_shell,kitty --single-instance --class float-full yzf -u
bind=SUPER,M,spawn_shell,mpv --player-operation-mode=pseudo-gui
bind=SUPER,N,spawn_shell,kitty --single-instance --class float-full vpn-command nyaazf 'naruto|-"kun.hu"|(varyg dual)'
bind=SUPER,X,spawn_shell,kitty --single-instance --class float-full --session ~/.config/kitty/session.conf
bind=SUPER,D,spawn,wcm
bind=SUPER+SHIFT,W,spawn_shell,iwmenu --launcher rofi
bind=SUPER+SHIFT,D,spawn,hyprpicker -a
bind=SUPER+SHIFT,Q,spawn_shell,kitty --single-instance --class float-full power-menu.sh
bind=SUPER,S,spawn_shell,kitty --single-instance --class float-half audio-switch
bind=SUPER,Tab,spawn_shell,rofi -show drun -show-icons
bind=SUPER+CTRL,s,spawn,subl

# ── Kitty launch-or-focus ─────────────────────────────────────
bind=SUPER+SHIFT,C,spawn,kitty-launch-or-focus.sh pacseek
bind=SUPER,C,spawn,kitty-launch-or-focus.sh pacsea
bind=SUPER,W,spawn,kitty-launch-or-focus.sh impala
bind=SUPER,K,spawn,kitty-launch-or-focus.sh nasc

# ── Kitty special ─────────────────────────────────────────────
bind=SUPER,grave,spawn_shell,kitty --single-instance --listen-on="unix:@mykitty" btm & sleep 0.4 && wtype -P m
bind=SUPER+SHIFT,grave,spawn_shell,kitty --single-instance --listen-on="unix:@mykitty" nvtop
bind=SUPER+ALT+CTRL,Return,spawn_shell,kitty --single-instance --listen-on="unix:@mykitty" flow --restore-session

# ── Pickers / menus ───────────────────────────────────────────
bind=SUPER,space,spawn,keyboard-layout-switcher.sh
bind=SUPER,V,spawn_shell,cclip-menu.sh -t 'kitty --single-instance --wait-for-single-instance-window-close --class float-half'
bind=SUPER,I,spawn_shell,cclip-images.sh -t 'kitty --single-instance --wait-for-single-instance-window-close --class float-full'
bind=SUPER,E,spawn_shell,emoji-picker.sh -t 'kitty --single-instance --wait-for-single-instance-window-close --class float-half'
bind=SUPER+ALT,E,spawn_shell,unicode-picker.sh -t 'kitty --single-instance --wait-for-single-instance-window-close --class float-half'
bind=SUPER+SHIFT,E,spawn_shell,nerdfont-picker.sh -t 'kitty --single-instance --wait-for-single-instance-window-close --class float-half'

# ── Screenshot / OCR ──────────────────────────────────────────
bind=SUPER+SHIFT,S,spawn_shell,flameshot gui
bind=SUPER+SHIFT,A,spawn_shell,dulcepan -f png | tesseract - stdout -l swe 2>/dev/null | wl-copy
bind=SUPER+SHIFT+ALT,A,spawn,ocrs.sh
bind=SUPER+SHIFT,X,spawn,wayscriber -a --no-resume-session

# ── Volume / Brightness ───────────────────────────────────────
bind=NONE,XF86AudioRaiseVolume,spawn,volume.sh up
bind=NONE,XF86AudioLowerVolume,spawn,volume.sh down
bind=NONE,XF86AudioMute,spawn,volume.sh mute
bind=SUPER,Prior,spawn,brightness.sh up
bind=SUPER,Next,spawn,brightness.sh down

# ── Mouse bindings ────────────────────────────────────────────
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_extra,toggleoverview

# ── Axis bindings ─────────────────────────────────────────────
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# ─── Layer Rules ──────────────────────────────────────────────
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
